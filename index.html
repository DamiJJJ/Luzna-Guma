<script>
// ── Constants ──────────────────────────────────────────────────────
const STORE_KEY = "luzna-guma:v1";
const THEME_KEY = "luzna-guma:theme";

const FONTS = {
  arial: "Arial, Helvetica, sans-serif",
  times: "'Times New Roman', Times, serif",
  georgia: "Georgia, 'Times New Roman', serif",
};

const DEFAULT_QUALIFICATION =
  "Na podstawie zgromadzonego materiału dowodowego prokuratura stwierdza, iż zgodnie z przepisami Penal Code stanu San Andreas przedstawione dowody wskazują na popełnienie przestępstwa, które kwalifikuje się do wymierzenia kary adekwatnej do popełnionych przez oskarżonego czynów.";
const DEFAULT_PAY_TERMS =
  "Zapłata następuje w sposób uzgodniony między stronami w chwili zawarcia umowy.";
const DEFAULT_AGENCIES = "LSPD, BCSO oraz innych uprawnionych organów";

// ── Small helpers ──────────────────────────────────────────────────
const $ = (sel) => document.querySelector(sel);
const pad = (n) => String(n).padStart(2, "0");
const clone = (o) => JSON.parse(JSON.stringify(o));

function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/** "2026-10-12" -> "12.10.2026" (or with another separator). */
function fmtDate(iso, sep = ".") {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return [d, m, y].join(sep);
}

/** "500000" -> "500 000$"; returns "" for empty / invalid input. */
function money(v) {
  const raw = String(v ?? "").replace(/[^\d]/g, "");
  if (!raw) return "";
  return String(Number(raw)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "$";
}

const filled = (arr, ...keys) => (arr || []).filter((it) => keys.some((k) => String(it[k] ?? "").trim()));
const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/** Join a list Polish-style: "a, b oraz c". */
function joinPl(parts) {
  if (parts.length < 2) return parts.join("");
  return parts.slice(0, -1).join(", ") + " oraz " + parts[parts.length - 1];
}

// ── Document building blocks (inline styles survive a paste into Google Docs) ──
const BLANK = '<span style="color:#9a9a9a;">....................</span>';
const val = (v) => (String(v ?? "").trim() ? esc(v) : BLANK);

function base(extra = "") {
  const font = FONTS[state.common.font] || FONTS.arial;
  return `font-family:${font};font-size:11pt;line-height:1.45;color:#000000;margin:0 0 6px 0;${extra}`;
}
const p = (html, extra = "") => `<p style="${base(extra)}">${html}</p>`;
const hr = () => '<hr style="border:none;border-top:1px solid #8a8a8a;margin:14px 0;">';
const heading = (t) => p(`<b>${t}</b>`, "font-size:12.5pt;margin:2px 0 8px 0;");
const kv = (label, v) => p(`<b>${esc(label)}:</b> ${val(v)}`, "margin:0 0 3px 0;");
const sig = (name) =>
  `<span style="font-family:'Dancing Script',cursive;font-size:18pt;line-height:1.2;">${val(name)}</span>`;

/** Ordered / unordered list; items are already-escaped HTML strings. */
function list(items, ordered = false) {
  if (!items.length) return "";
  const tag = ordered ? "ol" : "ul";
  // Explicit list-style: Tailwind's preflight resets it, and Google Docs reads it on paste
  const marker = `list-style-type:${ordered ? "decimal" : "disc"};`;
  const li = items.map((i) => `<li style="${base("margin:0 0 4px 0;" + marker)}">${i}</li>`).join("");
  return `<${tag} style="${base("padding-left:26px;" + marker)}">${li}</${tag}>`;
}

/** Free text -> paragraphs (blank line = new paragraph, newline = <br>). */
function paras(text) {
  const t = String(text ?? "").trim();
  if (!t) return p(BLANK);
  return t.split(/\n\s*\n/).map((chunk) => p(esc(chunk).replace(/\n/g, "<br>"), "text-align:justify;")).join("");
}

function section(title, body) {
  return hr() + (title ? heading(title) : "") + body;
}

function docHeader(title, dateIso) {
  return (
    p("SAN ANDREAS", "text-align:center;font-size:10pt;letter-spacing:4px;margin:0;color:#333333;") +
    p("<b>Department of Justice</b>", "text-align:center;font-size:20pt;margin:0 0 2px 0;") +
    hr() +
    p(`State San Andreas, ${val(fmtDate(dateIso))}`, "text-align:right;") +
    p(`<b>${esc(title)}</b>`, "text-align:center;font-size:17pt;margin:16px 0 6px 0;")
  );
}

// ── Indictment helpers ─────────────────────────────────────────────
function autoCaseNo(d) {
  const initials = String(d.name || "").trim().split(/\s+/).filter(Boolean)
    .slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "XX";
  const seq = pad(String(d.caseSeq || "1").replace(/\D/g, "") || 1);
  const [y, m, day] = (d.date || todayIso()).split("-");
  return `${initials}-${seq}-${day}${m}/${y.slice(2)}`;
}

function chargeLine(ch) {
  const art = String(ch.art || "").trim();
  const par = String(ch.par || "").trim();
  const lit = String(ch.lit || "").trim();
  const code = esc(state.common.codeName || "Penal Code");
  const ref = `Art. ${esc(art) || "..."}${par ? ` § ${esc(par)}` : ""}${lit ? ` lit. ${esc(lit)}` : ""} ${code}`;
  return `<b>${ref}</b>${ch.desc ? ` - ${esc(ch.desc)}` : ""}`;
}

function sentenceLine(d) {
  const parts = [];
  const months = String(d.months || "").replace(/\D/g, "");
  if (months) {
    const unit = Number(months) === 1 ? "miesiąca" : "miesięcy";
    parts.push(`wymierzenie kary ${months} ${unit} bezwzględnego pozbawienia wolności` +
      (d.noEarly ? " bez możliwości ubiegania się o wcześniejsze opuszczenie zakładu penitencjarnego" : ""));
  }
  const fines = filled(d.fines, "amount").map((f) =>
    `${money(f.amount)}${String(f.who || "").trim() ? ` na rzecz ${esc(f.who)}` : ""}`);
  if (fines.length) parts.push(`nałożenie grzywny w wysokości ${joinPl(fines)}`);
  return parts.length ? capitalize(parts.join(", ")) : "";
}

// ── Warrant helpers ────────────────────────────────────────────────
const WARRANT_TYPES = {
  both: { title: "Nakaz Przeszukania i Aresztowania", noun: "przeszukania i aresztowania" },
  arrest: { title: "Nakaz Aresztowania", noun: "aresztowania" },
  search: { title: "Nakaz Przeszukania", noun: "przeszukania" },
};

// ── Document definitions ───────────────────────────────────────────
// Each document: tab label, blank state, demo state, form schema, render.
// Form field: { key, label, type, half, span, rows, ph, hint, options, show, common }
// List field: { key, label, type: "list", add, item: [subfields] }

const PROSECUTOR_FIELDS = [
  { section: "Prokurator (zapamiętywany dla wszystkich dokumentów)" },
  { key: "prosecutor", label: "Imię i nazwisko", common: true, half: true, ph: "np. Thomas Lorenzo" },
  { key: "title", label: "Stanowisko", common: true, half: true },
];

const LOOK_FIELDS = [
  { section: "Wygląd" },
  { key: "font", label: "Czcionka dokumentu", type: "select", common: true,
    options: [["arial", "Arial (domyślna Google Docs)"], ["times", "Times New Roman"], ["georgia", "Georgia"]] },
];

const DOCS = {
  // ── Akt Oskarżenia ──
  indictment: {
    tab: "Akt Oskarżenia",
    blank: () => ({
      date: todayIso(), caseSeq: "01", caseNo: "", represents: "Department of Justice",
      name: "", address: "", ssn: "",
      charges: [{ art: "", par: "", lit: "", desc: "" }],
      narrative: "",
      evidence: [{ text: "" }],
      witnesses: [],
      qualification: DEFAULT_QUALIFICATION,
      months: "", noEarly: false,
      fines: [{ amount: "", who: "DOJ" }],
      requests: [],
      info: [],
    }),
    demo: () => ({
      date: todayIso(), caseSeq: "01", caseNo: "", represents: "Department of Justice",
      name: "Marco Valenti", address: "Apartamenty Alta Street, Los Santos", ssn: "4412",
      charges: [
        { art: "3", par: "4", lit: "", desc: "Pokonywanie zabezpieczeń bez uprawnień w celu dostania się do pojazdu lub pomieszczenia" },
        { art: "3", par: "6", lit: "", desc: "Paserstwo: przechowywanie i posiadanie przedmiotów powstałych w wyniku przestępstwa przeciwko mieniu" },
        { art: "9", par: "6", lit: "", desc: "Nielegalne posiadanie broni palnej i amunicji" },
        { art: "9", par: "7", lit: "", desc: "Użycie nielegalnej broni do popełnienia przestępstwa" },
      ],
      narrative:

        show: (d) => d.type !== "search" },

        ] },
      ...LOOK_FIELDS,

    render(d, c) {
      const kind = WARRANT_TYPES[d.type] || WARRANT_TYPES.both;
      const arrest = d.type !== "search";
      const search = d.type !== "arrest";
      const agencies = esc(String(d.agencies || "").trim() || DEFAULT_AGENCIES);

      const evidence = filled(d.evidence, "text").map((e) => esc(e.text));
      const witnesses = filled(d.witnesses, "name").map((w) =>
        `<b>${esc(w.name)}</b>${String(w.ssn || "").trim() ? ` (SSN: ${esc(w.ssn)})` : ""}` +
        `${String(w.statement || "").trim() ? `: ${esc(w.statement)}` : ""}`);
      const circumstances = [

        `<b>Zeznania świadków:</b>${list(witnesses) || " brak"}`,
        `<b>Pozostałe okoliczności:</b> ${val(d.other)}`,
      ];

      // What the warrant authorises, phrased per type
      const act = arrest && search
        ? "zatrzymania osoby wskazanej w § 1 oraz przeprowadzenia przeszukania miejsc wskazanych w § 4"

      const scope = [
        d.scopeHome && "Mieszkania / apartamentu należącego do osoby wskazanej w § 1.",

      const execution = [
        arrest && `Osoba wskazana w § 1 podlega zatrzymaniu przez uprawnione organy po ustaleniu jej tożsamości na okres co najmniej ${esc(String(d.hours || "48").replace(/\D/g, "") || "48")}h.`,
        "Po wykonaniu nakazu funkcjonariusz wykonujący nakaz zobowiązany jest do sporządzenia stosownej dokumentacji potwierdzającej jego wykonanie.",

      ].filter(Boolean);

      return (
        docHeader(kind.title, d.date) +
        section("§1. Osoba Objęta Nakazem",
          p(`Prokurator ${val(c.prosecutor)}, Prokurator Department of Justice Of The State Of San Andreas, niniejszym wydaje nakaz ${kind.noun} wobec:`) +
          kv("Imię i nazwisko", d.name) +
          kv("Social Security Number", d.ssn) +
          kv("Data urodzenia", fmtDate(d.dob, "/")) +
          kv("Adres zamieszkania", d.address)) +
        section("§2. Okoliczności Wydania Nakazu", list(circumstances, true)) +
        section("§3. Zakres Uprawnień Organów Wykonujących Nakaz", list([
          `Niniejszy nakaz uprawnia funkcjonariuszy ${agencies} do ${act}.`,
          `Funkcjonariusze wykonujący nakaz są uprawnieni do podjęcia czynności niezbędnych do jego skutecznego wykonania, w granicach obowiązujących przepisów.`,
          "W przypadku uzasadnionej konieczności funkcjonariusze mogą zastosować środki przymusu przewidziane obowiązującymi przepisami prawa.",
          "Jeżeli wykonanie nakazu wymaga przeprowadzenia dodatkowych czynności, mogą one zostać wykonane wyłącznie na podstawie właściwej podstawy prawnej lub odrębnego nakazu.",
        ], true)) +
        section("§4. Wykonanie Nakazu", list(execution, true)) +
        section("§5. Okres Obowiązywania Nakazu", list([
          "Niniejszy nakaz wchodzi w życie z chwilą jego wydania.",
          "Nakaz pozostaje w mocy do czasu:" + list(["wykonania nakazu,", "jego uchylenia przez właściwy organ,", "wydania postanowienia o jego wygaśnięciu."]),
          "Po wykonaniu lub uchyleniu nakazu dokument należy oznaczyć jako Rozpatrywany.",
        ], true)) +
        section("§6. Postanowienia Końcowe", list([
          "Niniejszy nakaz został wydany na podstawie zgromadzonego materiału dowodowego oraz okoliczności wskazanych w niniejszym dokumencie.",
          "Zakres wykonania nakazu ogranicza się do czynności określonych w jego treści oraz wynikających z obowiązujących przepisów prawa.",
          `Nakaz stanowi podstawę do ${act} przez uprawnione organy.`,
          "Wszelkie czynności wykraczające poza zakres niniejszego nakazu wymagają odrębnej podstawy prawnej.",
          "Oryginał nakazu pozostaje w aktach właściwej sprawy.",
        ], true)) +
        section("Podpis",
          p(`Prokurator: ${sig(c.prosecutor)}`, "margin:4px 0 0 0;") +
          p(val(c.title), "margin:0 0 10px 0;font-size:9.5pt;color:#444444;") +
          p(`Sędzia: ${sig(d.judge)}`, "margin:0;"))
      );
    },

          p("Z chwilą podpisania niniejszej umowy własność pojazdu przechodzi na Kupującego.")) +
        section("§7. Dokumentacja i Koszty", list([
          "Sprzedający zobowiązuje się do przekazania Kupującemu wszelkiej dokumentacji związanej z pojazdem.",
          costs,
        ], true)) +
        section("§8. Postanowienia Końcowe", list([
          "Umowę sporządzono w dwóch jednobrzmiących egzemplarzach, po jednym dla każdej ze stron.",
          "W sprawach nieuregulowanych zastosowanie mają przepisy prawa powszechnie obowiązującego.",
        ], true)) +
        section("Podpisy",
          p(`Sprzedający: ${sig(d.sellerName)}`, "margin:4px 0 2px 0;") +
          p(`Kupujący: ${sig(d.buyerName)}`, "margin:0 0 2px 0;") +
          p(`Wykonawca dokumentu: ${sig(c.prosecutor)}`, "margin:0;") +
          p(val(c.title), "font-size:9.5pt;color:#444444;"))
      );
    },
  },
};

const COMMON_DEFAULTS = {
  prosecutor: "",
  title: "Prokurator Department of Justice",
  codeName: "Penal Code",
  font: "arial",
};

const AUTO = { caseNo: () => autoCaseNo(state.indictment) };

// ── State + persistence ────────────────────────────────────────────
function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  const s = { doc: "indictment", common: { ...COMMON_DEFAULTS, ...(saved?.common || {}) } };
  for (const id of Object.keys(DOCS)) s[id] = { ...DOCS[id].blank(), ...(saved?.[id] || {}) };
  if (saved && DOCS[saved.doc]) s.doc = saved.doc;
  return s;
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();

const getPath = (path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), state);
function setPath(path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  keys.reduce((o, k) => o[k], state)[last] = value;
}

// ── Form rendering ─────────────────────────────────────────────────
const INPUT =
  "w-full rounded-lg border border-l-line bg-l-field px-3 py-2 text-sm text-ink placeholder:text-l-muted/60 " +
  "transition focus:border-l-accent focus:outline-none focus:ring-2 focus:ring-l-accent/25 " +
  "dark:border-line dark:bg-field dark:text-white dark:placeholder:text-white/35 dark:focus:border-gold dark:focus:ring-gold/30";
const LABEL = "mb-1 block text-xs font-medium text-l-muted dark:text-white/60";
const ICON_BTN =
  "grid h-7 w-7 place-items-center rounded-md text-l-muted transition hover:bg-l-panel-2 hover:text-ink " +
  "disabled:pointer-events-none disabled:opacity-30 dark:text-white/50 dark:hover:bg-panel-2 dark:hover:text-white";
const SPAN = { 1: "col-span-1", 2: "col-span-2", 3: "col-span-3", 4: "col-span-4", 5: "col-span-5", 6: "col-span-6" };

let listDefs = {};

function controlHtml(f, path, value) {
  const v = value ?? "";
  const data = `data-path="${path}"`;
  if (f.type === "checkbox") {
    return `<label class="flex cursor-pointer select-none items-center gap-2.5 py-1 text-sm">
      <input type="checkbox" ${data} data-rerender class="h-4 w-4 rounded accent-l-accent dark:accent-gold" ${v ? "checked" : ""}>
      <span>${f.label}</span></label>`;
  }
  let ctrl;
  if (f.type === "select") {
    ctrl = `<select ${data} data-rerender class="${INPUT}">` +
      f.options.map(([o, l]) => `<option value="${o}" ${o === v ? "selected" : ""}>${l}</option>`).join("") +
      "</select>";
  } else if (f.type === "textarea") {
    ctrl = `<textarea ${data} rows="${f.rows || 3}" class="${INPUT} resize-y leading-relaxed" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>`;
  } else {
    const extra = f.type === "number" ? 'min="0" inputmode="numeric"' : "";
    ctrl = `<input type="${f.type || "text"}" ${data} ${f.auto ? `data-auto="${f.auto}"` : ""} ${extra}
      value="${esc(v)}" class="${INPUT}" placeholder="${esc(f.ph || "")}">`;
  }
  const hint = f.hint ? `<span class="mt-1 block text-[11px] leading-snug text-l-muted/80 dark:text-white/40">${f.hint}</span>` : "";
  return `<label class="block"><span class="${LABEL}">${f.label}</span>${ctrl}${hint}</label>`;
}

function listHtml(f, path) {
  listDefs[path] = f;
  const items = getPath(path) || [];
  const rows = items.map((it, i) => `
    <div class="rounded-xl border border-l-line bg-l-panel-2/60 p-3 dark:border-line dark:bg-panel-2/60">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-xs font-bold text-l-accent dark:text-gold">#${i + 1}</span>
        <span class="flex gap-0.5">
          <button type="button" class="${ICON_BTN}" data-act="up" data-list="${path}" data-i="${i}" aria-label="Przesuń w górę" ${i === 0 ? "disabled" : ""}>
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
          <button type="button" class="${ICON_BTN}" data-act="down" data-list="${path}" data-i="${i}" aria-label="Przesuń w dół" ${i === items.length - 1 ? "disabled" : ""}>
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <button type="button" class="${ICON_BTN} hover:!text-red-500" data-act="remove" data-list="${path}" data-i="${i}" aria-label="Usuń">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </span>
      </div>
      <div class="grid grid-cols-6 gap-2">
        ${f.item.map((sf) => `<div class="${SPAN[sf.span || 6]}">${controlHtml(sf, `${path}.${i}.${sf.key}`, it[sf.key])}</div>`).join("")}
      </div>
    </div>`).join("");

  return `<div class="col-span-2">
    <span class="${LABEL}">${f.label}</span>
    <div class="space-y-2">${rows}</div>
    <button type="button" data-act="add" data-list="${path}"
      class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-lg border border-dashed border-l-line py-2 text-xs font-semibold text-l-accent transition hover:border-l-accent hover:bg-l-panel-2 dark:border-line dark:text-gold dark:hover:border-gold dark:hover:bg-panel-2">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      ${f.add}</button>
  </div>`;
}

function fieldHtml(f) {
  if (f.section) {
    return `<h3 class="col-span-2 mt-4 border-t border-l-line pt-4 text-[11px] font-bold uppercase tracking-[0.14em] text-l-accent first:mt-0 first:border-0 first:pt-0 dark:border-line dark:text-gold">${f.section}</h3>`;
  }
  const path = `${f.common ? "common" : state.doc}.${f.key}`;
  if (f.type === "list") return listHtml(f, path);
  return `<div class="${f.half ? "col-span-2 sm:col-span-1" : "col-span-2"}">${controlHtml(f, path, getPath(path))}</div>`;
}

function renderForm() {
  listDefs = {};
  const d = state[state.doc];
  $("#form").innerHTML = DOCS[state.doc].form.filter((f) => !f.show || f.show(d)).map(fieldHtml).join("");
  refreshAuto();
}

function refreshAuto() {
  document.querySelectorAll("[data-auto]").forEach((el) => { el.placeholder = AUTO[el.dataset.auto](); });
}

// ── Tabs + preview ─────────────────────────────────────────────────
function renderTabs() {
  $("#tabs").innerHTML = Object.entries(DOCS).map(([id, def]) => {
    const active = id === state.doc;
    const cls = active
      ? "bg-l-accent text-white shadow-sm dark:bg-gold dark:text-navy"
      : "border border-l-line bg-l-panel text-ink hover:bg-l-panel-2 dark:border-line dark:bg-panel dark:text-white/80 dark:hover:bg-panel-2";
    return `<button type="button" role="tab" aria-selected="${active}" data-doc="${id}"
      class="shrink-0 rounded-xl px-4 py-2.5 text-sm font-semibold transition ${cls}">${def.tab}</button>`;
  }).join("");
}

function renderDoc() {
  $("#doc").innerHTML = DOCS[state.doc].render(state[state.doc], state.common);
}

function renderAll() {
  renderTabs();
  renderForm();
  renderDoc();
}

function afterChange(rerenderForm) {
  saveState();
  if (rerenderForm) renderForm(); else refreshAuto();
  renderDoc();
}

// ── Events ─────────────────────────────────────────────────────────
const formEl = $("#form");

formEl.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.dataset.path || "rerender" in t.dataset) return;
  setPath(t.dataset.path, t.value);
  afterChange(false);
});

formEl.addEventListener("change", (e) => {
  const t = e.target;
  if (!t.dataset.path || !("rerender" in t.dataset)) return;
  setPath(t.dataset.path, t.type === "checkbox" ? t.checked : t.value);
  afterChange(true);
});

formEl.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const path = btn.dataset.list;
  const arr = getPath(path);
  const i = Number(btn.dataset.i);
  const def = listDefs[path];
  let focusIndex = null;

  switch (btn.dataset.act) {
    case "add":
      arr.push(Object.fromEntries(def.item.map((sf) => [sf.key, sf.type === "checkbox" ? false : ""])));
      focusIndex = arr.length - 1;
      break;
    case "remove":
      arr.splice(i, 1);
      break;
    case "up":
    case "down": {
      const j = btn.dataset.act === "up" ? i - 1 : i + 1;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      break;
    }
  }
  afterChange(true);
  if (focusIndex !== null) {
    document.querySelector(`[data-path="${path}.${focusIndex}.${def.item[0].key}"]`)?.focus();
  }
});

$("#tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-doc]");
  if (!btn || btn.dataset.doc === state.doc) return;
  state.doc = btn.dataset.doc;
  saveState();
  renderAll();
});

$("#demoBtn").addEventListener("click", () => {
  state[state.doc] = DOCS[state.doc].demo();
  if (!String(state.common.prosecutor).trim()) state.common.prosecutor = "Victoria Hale";
  afterChange(true);
  toast("Wczytano przykładowe dane.");
});

$("#clearBtn").addEventListener("click", () => {
  if (!confirm(`Wyczyścić formularz „${DOCS[state.doc].tab}"? Dane prokuratora zostaną.`)) return;
  state[state.doc] = DOCS[state.doc].blank();
  afterChange(true);
});

$("#printBtn").addEventListener("click", () => window.print());
$("#copyBtn").addEventListener("click", copyDoc);

$("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (e) {}
});

// ── Copy to clipboard (rich HTML for Google Docs + plain text fallback) ──
async function copyDoc() {
  const docEl = $("#doc");
  const html = `<meta charset="utf-8"><div>${docEl.innerHTML}</div>`;
  const text = docEl.innerText;
  try {
    if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error("no async clipboard");
    await navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([text], { type: "text/plain" }),
    })]);
  } catch (err) {
    // Fallback: select the rendered document and use the legacy copy command
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(docEl);
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand("copy");
    sel.removeAllRanges();
    if (!ok) { toast("Nie udało się skopiować. Zaznacz podgląd ręcznie i skopiuj.", true); return; }
  }
  toast("Skopiowano! Wklej w pustym Google Docs (Ctrl/Cmd + V).");
}

// ── Toast ──────────────────────────────────────────────────────────
let toastTimer;
const TOAST_BASE = $("#toast").className;
function toast(msg, isError = false) {
  const el = $("#toast");
  el.textContent = msg;
  el.className = TOAST_BASE + (isError ? " bg-red-600 text-white" : " bg-ink text-white dark:bg-gold dark:text-navy");
  el.classList.remove("opacity-0", "translate-y-4");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("opacity-0", "translate-y-4"), 2600);
}

renderAll();
</script>
</body>
</html>
